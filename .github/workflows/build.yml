name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix permissions and SDK licenses
        run: |
          chown -R $(whoami) .
          mkdir -p /opt/android-sdk
          echo "y" | sdkmanager --licenses 2>/dev/null || true

      - name: Pin pip to compatible version
        run: |
          python3 -m pip install --upgrade "pip<24"
          python3 -m pip --version

      - name: Build APK with buildozer
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lottery-app
          path: bin/*.apk
